# Configuration unique du projet "température des coups d'échecs"
seed: 20261119

data:
  url: https://database.lichess.org/standard/lichess_db_standard_rated_2026-10.pgn.zst
  max_bytes: 2147483648          # on ne télécharge que les 2 premiers Go (préfixe du mois)
  raw_file: data/raw/lichess_2026-10_first2GB.pgn.zst

sample:
  cadences: [Blitz, Rapid]       # d'après le tag Event de Lichess
  elo_min: 800
  elo_max: 2600
  elo_step: 200                  # les deux joueurs doivent être dans la même tranche
  reservoir_per_cell: 3500       # parties tirées par case (cadence x tranche), sur-échantillonnage
  skip_first_plies: 10           # exclut les 10 premiers demi-coups
  min_legal_moves: 2             # une position à coup forcé n'apporte aucune information
  output: data/sample_positions.csv

engine:
  path: bin/stockfish            # Stockfish 18 (binaire officiel ubuntu-x86-64-avx2)
  depth: 16
  multipv: 5
  hash_mb: 64
  workers: 3                     # tous les cœurs sauf un
  output: data/evals.jsonl

filter:
  max_abs_cp: 500                # exclut |éval du meilleur coup| > 500 cp
  target_per_cell: 1000          # positions retenues par case après filtrage (pilote B ; 2000 possible ensuite)

fit:
  cp_clip: 1000                  # variante 1 : centipions écrêtés à ±1000 (mat -> ±1000)
  wp_coef: 0.00368208            # variante 2 : proba de gain Lichess, en % (0-100)
  n_boot: 200
  ci: 0.95
  outdir: results

shape:                           # piste 1 : forme de la loi de choix
  n_boot: 100
  elo_groups: [[800, 1400], [1400, 2000], [2000, 2600]]

extra:                           # réévaluations des positions retenues (contrôles de la piste 1)
  noise:                         # B : bruit d'évaluation, profondeur 20 (22 : 4,1 s/position, trop lent) sur un sous-échantillon
    depth: 20
    multipv: 5
    n_positions: 1000
    output: data/evals_noise_d20.jsonl
  spectrum:                      # A : spectre complet, tous les coups légaux
    depth: 12
    multipv: all
    output: data/evals_spectrum_d12.jsonl

attention:                       # piste 7 : modèle à deux étages (coups envisagés puis choix)
  n_boot: 50

clock:                           # piste 2 : température en fonction du temps restant
  n_boot: 100
  frac_edges: [0, 0.1, 0.25, 0.5, 0.75, 10]   # fraction du temps initial restant (> 1 possible avec l'incrément)

phase:                           # contrôle de la piste 2 : temps restant à phase de jeu fixée
  n_boot: 30
  ply_edges: [0, 30, 50, 70, 1000]   # demi-coups ; niveau 0 = ouverture
  mat_edges: [0, 8, 14, 20, 100]      # matériel non-pion (24 au départ) ; niveau 0 = matériel le plus élevé

lead:                            # piste 3 : champ extérieur (score du joueur au trait)
  n_boot: 100
  eval_edges: [-10000, -300, -100, 100, 300, 10000]   # cp, point de vue du joueur au trait

postype:                         # piste 6 : type de position
  n_boot: 100
  gap_edges: [0, 10, 30, 100, 300, 10000]   # écart (cp) entre meilleur et 2e coup ; >300 = coup unique
  nlegal_edges: [0, 20, 30, 40, 1000]

fdt:                             # piste 4 : fluctuation-dissipation
  n_boot: 50

players:                         # piste 5 : désordre (températures individuelles), Blitz
  raw_file: data/raw/lichess_2026-10_first1GB.pgn.zst   # préfixe de 1 Go (~45 h de parties)
  elo_min: 800
  elo_max: 2400
  elo_step: 200
  min_games: 40                  # parties Blitz éligibles du joueur dans le préfixe
  players_per_band: 20
  n_games: 25                    # une position par partie, le joueur étant au trait
  depth: 10                      # tous les coups légaux (0,21 s/position)
  positions: data/players_positions.csv
  evals: data/evals_players_d10.jsonl
  n_perm: 10

entropy:                         # piste 8 (pilote) : énergie contre entropie des positions atteintes
  cadence: Blitz
  n_per_band: 112                # ~1000 positions
  K: 8                           # coups candidats par position
  depth: 10                      # positions filles et petites-filles, tous les coups légaux
  workers: 4
  good_cp: 50                    # « bon coup » : à moins de 50 cp du meilleur
  out_children: data/evals_entropy_children_d10.jsonl
  out_grand: data/evals_entropy_grand_d10.jsonl

heat:                            # chaleur spécifique C = β² Var(ΔE^c)
  n_grid: 40
